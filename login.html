<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>FeMOS — Log In</title>
    <style>
      :root {
        --water-light: #5fd4f0;
        --water-mid: #2ea8ee;
        --water-deep: #155fd1;
        --water-abyss: #0b2f9e;
        --ink: #0d1b4b;
        --muted: #5c6b9a;
        --line: #dbe6fb;
        --danger: #e14b4b;
        --success: #1fae6e;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        min-height: 100%;
      }
      body {
        background: linear-gradient(180deg, #eef5ff 0%, #f7fbff 100%);
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          Roboto,
          sans-serif;
        color: var(--ink);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        overflow-x: hidden;
      }
      body::before,
      body::after {
        content: "";
        position: fixed;
        inset: auto;
        width: 260px;
        height: 260px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(46, 168, 238, 0.22),
          transparent 70%
        );
        filter: blur(24px);
        z-index: -1;
        animation: floatOrb 6s ease-in-out infinite;
      }
      body::before {
        top: -70px;
        left: -40px;
      }
      body::after {
        bottom: -80px;
        right: -40px;
        animation-delay: 1.8s;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: rgba(255, 255, 255, 0.97);
        border-radius: 24px;
        box-shadow: 0 20px 60px rgba(13, 27, 75, 0.12);
        padding: 36px 28px;
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.75);
        animation: riseIn 0.7s ease both;
      }
      .logo-mini {
        width: 82px;
        height: 82px;
        margin: 0 auto 16px;
        display: block;
        border-radius: 50%;
        overflow: hidden;
        background: linear-gradient(135deg, #eef8ff 0%, #dcefff 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow:
          0 0 0 4px rgba(255, 255, 255, 0.9),
          0 16px 40px rgba(21, 95, 209, 0.24);
        border: 3px solid rgba(255, 255, 255, 0.95);
        animation: floatLogo 3.8s ease-in-out infinite;
        position: relative;
      }
      .logo-mini::before {
        content: "";
        position: absolute;
        inset: -2px;
        border-radius: inherit;
        background: linear-gradient(
          135deg,
          rgba(46, 168, 238, 0.65),
          rgba(21, 95, 209, 0.9)
        );
        z-index: -1;
        filter: blur(8px);
        opacity: 0.35;
      }
      .logo-mini img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        padding: 4px;
      }
      h1.brand {
        text-align: center;
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(90deg, var(--water-mid), var(--water-deep));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: 4px;
      }
      p.tag {
        text-align: center;
        font-size: 0.74rem;
        color: var(--muted);
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 30px;
      }
      h2.title {
        font-size: 1.15rem;
        font-weight: 700;
        margin-bottom: 22px;
        text-align: center;
        color: var(--ink);
      }
      .field {
        margin-bottom: 16px;
      }
      .field label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .input-wrap {
        position: relative;
      }
      .input-wrap svg {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        width: 18px;
        height: 18px;
        stroke: var(--muted);
        fill: none;
        stroke-width: 1.8;
        pointer-events: none;
      }
      .input-wrap input {
        width: 100%;
        padding: 13px 14px 13px 42px;
        border-radius: 12px;
        border: 1.5px solid var(--line);
        font-size: 0.95rem;
        color: var(--ink);
        background: #fbfdff;
      }
      .input-wrap input:focus {
        outline: none;
        border-color: var(--water-mid);
        box-shadow: 0 0 0 3px rgba(46, 168, 238, 0.15);
      }
      .btn {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        font-weight: 700;
        font-size: 0.95rem;
        cursor: pointer;
        background: linear-gradient(90deg, var(--water-mid), var(--water-deep));
        color: #fff;
        transition:
          transform 0.15s,
          box-shadow 0.15s;
      }
      .btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 24px rgba(21, 95, 209, 0.3);
      }
      .btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }
      .linkline {
        text-align: center;
        margin-top: 20px;
        font-size: 0.88rem;
        color: var(--muted);
      }
      .linkline a {
        color: var(--water-deep);
        font-weight: 600;
        text-decoration: none;
      }
      .linkline a:hover {
        text-decoration: underline;
      }
      .msg {
        margin-top: 14px;
        padding: 11px 14px;
        border-radius: 10px;
        font-size: 0.85rem;
        display: none;
      }
      .msg.show {
        display: block;
      }
      .msg.err {
        background: #fdecec;
        color: var(--danger);
      }
      .msg.ok {
        background: #e9f9f1;
        color: var(--success);
      }
      @media (max-width: 380px) {
        .card {
          padding: 26px 18px;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo-mini">
        <img
          src="https://res.cloudinary.com/j8zmetxr/image/upload/v1784632765/FeOS_hwl9eh.png"
          alt="FeMOS logo"
        />
      </div>
      <h1 class="brand">FeMOS</h1>
      <p class="tag">FastLine Campus OS</p>
      <h2 class="title">Log In With Your Password</h2>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email Address</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24">
              <path d="M4 6h16v12H4z" />
              <path d="m4 7 8 6 8-6" />
            </svg>
            <input
              type="email"
              id="email"
              placeholder="jaybros@gmail.com"
              required
              autocomplete="email"
            />
          </div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24">
              <rect x="5" y="11" width="14" height="9" rx="2" />
              <path d="M8 11V7a4 4 0 0 1 8 0v4" />
            </svg>
            <input
              type="password"
              id="password"
              placeholder="••••••••"
              required
              autocomplete="current-password"
            />
          </div>
        </div>
        <button type="submit" class="btn" id="btnLogin">Log In</button>
        <div class="msg" id="msgBox"></div>
      </form>

      <div class="linkline">
        Are you new in FeMOS? <a href="signup.html">Sign Up Here</a>
      </div>
    </div>

    <!-- ================= FIREBASE SDK (compat) ================= -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyCb-Y69glDSkNDwgzoCXyUVAz6D86Ccdfo",
        authDomain: "femos-fe742.firebaseapp.com",
        projectId: "femos-fe742",
        storageBucket: "femos-fe742.firebasestorage.app",
        messagingSenderId: "1022203442714",
        appId: "1:1022203442714:web:4fa06d28d788c024bf83a3",
        measurementId: "G-M4DEBFVJCV",
      };

      function validateFirebaseConfig() {
        const missing = [];
        if (!firebaseConfig.apiKey || firebaseConfig.apiKey.includes("PUT_"))
          missing.push("Firebase API key");
        if (
          !firebaseConfig.authDomain ||
          firebaseConfig.authDomain.includes("PUT_")
        )
          missing.push("Firebase auth domain");
        if (
          !firebaseConfig.projectId ||
          firebaseConfig.projectId.includes("PUT_")
        )
          missing.push("Firebase project ID");
        if (
          !firebaseConfig.storageBucket ||
          firebaseConfig.storageBucket.includes("PUT_")
        )
          missing.push("Firebase storage bucket");
        if (
          !firebaseConfig.messagingSenderId ||
          firebaseConfig.messagingSenderId.includes("PUT_")
        )
          missing.push("Firebase messaging sender ID");
        if (!firebaseConfig.appId || firebaseConfig.appId.includes("PUT_"))
          missing.push("Firebase app ID");
        if (missing.length) {
          throw new Error(
            "Missing required Firebase config values: " + missing.join(", "),
          );
        }
      }

      validateFirebaseConfig();
      const app = firebase.apps.length
        ? firebase.app()
        : firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth(app);
      const db = firebase.firestore(app);

      const form = document.getElementById("loginForm");
      const msgBox = document.getElementById("msgBox");
      const btnLogin = document.getElementById("btnLogin");

      function showMsg(text, type) {
        msgBox.textContent = text;
        msgBox.className = "msg show " + type;
      }

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        btnLogin.disabled = true;
        btnLogin.textContent = "Logging in...";
        try {
          const cred = await auth.signInWithEmailAndPassword(email, password);
          const uid = cred.user.uid;
          // Check whether the user has already completed institution/course registration
          const doc = await db.collection("users").doc(uid).get();
          const data = doc.exists ? doc.data() : null;
          if (data && data.institution && data.course) {
            window.location.href = "dashboard.html"; // dashboard page - to be built next
          } else {
            window.location.href = "registration.html";
          }
        } catch (err) {
          const message =
            err && err.code === "auth/configuration-not-found"
              ? "Firebase Authentication is not configured for this project. Please enable Email/Password sign-in in Firebase Console > Authentication > Sign-in method."
              : "Login failed: " +
                (err.message || "Check your email and password");
          showMsg(message, "err");
        } finally {
          btnLogin.disabled = false;
          btnLogin.textContent = "Log In";
        }
      });
    </script>
  </body>
</html>
