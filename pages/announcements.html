<!DOCTYPE html>
<html lang="sw" data-theme="dark">
<head>
  <title>Matangazo — FeMOS</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#060C18">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../assets/logo-48.png" type="image/png">
  <link rel="stylesheet" href="../css/style.css">
<style>.filter-chip.active{background:rgba(0,212,255,.12)!important;border-color:rgba(0,212,255,.28)!important;color:var(--clr-cyan)!important;}</style>
</head>
<body>
<div class="femos-ambient" aria-hidden="true"></div>
<div id="toast-portal" aria-live="polite"></div>
<div id="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
  <div class="confirm-box">
    <div class="confirm-emoji" id="confirm-emoji">⚠️</div>
    <div class="confirm-title" id="confirm-title">Una uhakika?</div>
    <div class="confirm-desc"  id="confirm-desc">Kitendo hiki hakiwezi kurudishwa.</div>
    <div class="confirm-actions">
      <button class="btn btn-ghost" id="confirm-cancel">Ghairi</button>
      <button class="btn btn-danger" id="confirm-ok">Thibitisha</button>
    </div>
  </div>
</div>
<div id="femos-root">
  <div class="page-content">
    <div class="status-bar" aria-hidden="true">
      <span class="time" data-live-clock>09:41</span>
      <div class="indicators"><span data-network-status>●●●●</span><span class="battery">⚡ 87%</span></div>
    </div>
    
    <div style="display:flex;align-items:center;justify-content:space-between;padding:var(--s-2) var(--s-5) 6px;flex-shrink:0">
      <span style="font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--text-primary);letter-spacing:-.03em">Matangazo</span>
      <button class="btn-icon" onclick="window.location.href='compose.html'" aria-label="Andika tangazo">✏️</button>
    </div>
    <div id="pend-banner" class="hidden" style="display:flex;align-items:center;gap:10px;padding:12px var(--s-5);background:rgba(255,75,110,.08);border-bottom:1px solid rgba(255,75,110,.15);font-size:13px;color:var(--clr-danger);cursor:pointer;font-weight:500;flex-shrink:0" onclick="window.location.href='announcements.html'" role="alert">
      ⚠️ <span id="pend-cnt">0</span> matangazo yanahitaji uthibitisho wako ›
    </div>
    <div style="display:flex;gap:8px;padding:10px var(--s-5) 12px;overflow-x:auto;flex-shrink:0;scrollbar-width:none" id="filter-row">
      <button class="btn btn-secondary btn-sm filter-chip active" data-filter="all"       onclick="AnnPage.filter('all',this)">Zote</button>
      <button class="btn btn-ghost btn-sm filter-chip" data-filter="emergency" onclick="AnnPage.filter('emergency',this)">🚨 Dharura</button>
      <button class="btn btn-ghost btn-sm filter-chip" data-filter="academic"  onclick="AnnPage.filter('academic',this)">📝 Kitaaluma</button>
      <button class="btn btn-ghost btn-sm filter-chip" data-filter="general"   onclick="AnnPage.filter('general',this)">📢 Jumla</button>
      <button class="btn btn-ghost btn-sm filter-chip" data-filter="deadline"  onclick="AnnPage.filter('deadline',this)">⏰ Tarehe</button>
      <button class="btn btn-ghost btn-sm filter-chip" data-filter="info"      onclick="AnnPage.filter('info',this)">📰 Habari</button>
    </div>
    <!-- Ann detail modal -->
    <div class="modal-overlay" id="ann-modal">
      <div class="modal-sheet" id="ann-modal-sheet">
        <div class="modal-handle"></div>
        <div style="padding:0 var(--s-6) 12px">
          <div id="m-type" style="font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px"></div>
          <div class="heading-lg" id="m-title" style="margin-bottom:6px"></div>
          <div style="font-size:12px;color:var(--text-tertiary)" id="m-sender"></div>
          <div style="font-size:11px;color:var(--text-tertiary)" id="m-time"></div>
        </div>
        <div style="height:1px;background:var(--divider);margin:0 var(--s-6)"></div>
        <div style="padding:16px var(--s-6);font-size:14px;color:var(--text-secondary);line-height:1.7" id="m-body"></div>
        <div id="m-stats" class="hidden" style="padding:0 var(--s-6) 16px">
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
            <div class="stat-chip"><div class="stat-chip-val" style="color:var(--clr-cyan)" id="ms-read">0</div><div class="stat-chip-lbl">Wamesoma</div></div>
            <div class="stat-chip"><div class="stat-chip-val" style="color:var(--clr-success)" id="ms-acked">0</div><div class="stat-chip-lbl">Walikubali</div></div>
            <div class="stat-chip"><div class="stat-chip-val" style="color:var(--clr-danger)" id="ms-pending">0</div><div class="stat-chip-lbl">Hawajakubali</div></div>
          </div>
        </div>
        <div style="padding:0 var(--s-6) 16px;display:flex;flex-direction:column;gap:10px">
          <button class="btn btn-primary btn-full hidden" id="m-ack-btn">✅ Nimeelewa na Kukubali Tangazo Hili</button>
          <div class="hidden" id="m-acked-badge" style="text-align:center"><span class="tag tag-green">✅ Umekubali tangazo hili</span></div>
          <button class="btn btn-ghost btn-full" onclick="App.Modal.close('ann-modal')">Funga</button>
        </div>
      </div>
    </div>
    <div class="scroll-area with-bnav">
      <div style="padding:0 var(--s-5);display:flex;flex-direction:column;gap:8px" id="ann-list"></div>
      <div style="height:12px"></div>
    </div>

  </div>
  <nav class="bottom-nav" aria-label="Urambazaji mkuu">
    <div class="nav-item" onclick="window.location.href=\"home.html\"" role="link" tabindex="0" aria-label="Nyumbani">
      <div class="nav-icon-wrap">🏠</div>
      <span class="nav-label">Nyumbani</span>
    </div>
    <div class="nav-item" onclick="window.location.href=\"attendance.html\"" role="link" tabindex="0" aria-label="Mahudhurio">
      <div class="nav-icon-wrap">✅</div>
      <span class="nav-label">Mahudhurio</span>
    </div>
    <button class="nav-fab" onclick="window.location.href=\"compose.html\"" aria-label="Andika tangazo">＋</button>
    <div class="nav-item active" onclick="window.location.href=\"announcements.html\"" role="link" tabindex="0" aria-label="Matangazo" aria-current="page">
      <div class="nav-icon-wrap">🔔</div>
      <span class="nav-label">Matangazo</span>
    </div>
    <div class="nav-item" onclick="window.location.href=\"profile.html\"" role="link" tabindex="0" aria-label="Profile">
      <div class="nav-icon-wrap">👤</div>
      <span class="nav-label">Profile</span>
    </div>
  </nav>
</div>
<script src="../js/db.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/router.js"></script>
<script src="../js/app.js"></script>
<script>

const ANN_CFG = {
  emergency:{emoji:'🚨',color:'#FF4B6E',label:'Dharura',    requiresAck:true},
  academic: {emoji:'📝',color:'#00D4FF',label:'Kitaaluma',  requiresAck:true},
  general:  {emoji:'📢',color:'#9B6DFF',label:'Jumla',      requiresAck:false},
  info:     {emoji:'📰',color:'#4A5568',label:'Habari',     requiresAck:false},
  deadline: {emoji:'⏰',color:'#FFB830',label:'Tarehe',     requiresAck:false},
  poll:     {emoji:'🗳️',color:'#FFB830',label:'Kura',       requiresAck:true},
};
const DEMO_ANN = [
  {id:'a1',type:'emergency',title:'Zoezi la Dharura ya Moto',body:'Kutakuwa na zoezi la dharura ya moto leo saa 10 asubuhi. Wanafunzi wote wanatakiwa kutoka nje ya majengo kwa utaratibu na kwenda Assembly Point A karibu na lango la mashariki.',sender:{name:'Ofisi ya VC',role:'vc',emoji:'🏛️'},sentAt:Date.now()-7200000,requiresAck:true,readBy:[],ackedBy:[]},
  {id:'a2',type:'academic', title:'CAT ya CS301 Imebadilishwa',body:'Mtihani wa CAT wa Computer Networks II umebadilishwa kutoka Ijumaa hadi Jumatatu tarehe 22. Chumba kinabaki LH-B. Muda ni saa 10 asubuhi.',sender:{name:'Dr. David Mkwasa',role:'lecturer',emoji:'👨‍🏫'},sentAt:Date.now()-18000000,requiresAck:true,readBy:['demo_student'],ackedBy:[]},
  {id:'a3',type:'deadline', title:'Assignment 3 — OS Concepts (Kesho)',body:'Ukumbusho: Assignment ya 3 ya Operating Systems inastahili kesho saa 11 usiku. Wasilisha kupitia FeMOS Local Cloud au kwa mkono ofisini.',sender:{name:'Dr. David Mkwasa',role:'lecturer',emoji:'👨‍🏫'},sentAt:Date.now()-3600000,requiresAck:false,readBy:[],ackedBy:[]},
  {id:'a4',type:'general',  title:'Mkutano wa CR — Alhamisi',body:'Wawakilishi wote wa madarasa wanaalikwa kwenye mkutano Alhamisi saa 3 asubuhi katika chumba cha mikutano cha Admin Block. Agenda kuu ni kupanga ratiba ya mitihani.',sender:{name:'CR — CS Year 3',role:'cr',emoji:'🎓'},sentAt:Date.now()-86400000,requiresAck:false,readBy:[],ackedBy:[]},
  {id:'a5',type:'info',     title:'Vitabu Vipya — Maktaba',body:'Vitabu vipya vya Computer Networks (Tanenbaum 6th Ed) vimefika maktabani. Nakala 20 zinapatikana. Jisajilishe mapema.',sender:{name:'Maktaba — MUST',role:'uni-admin',emoji:'📚'},sentAt:Date.now()-172800000,requiresAck:false,readBy:[],ackedBy:[]},
];
function getAnns(){return DB.LS.get('femos_announcements')||DEMO_ANN;}
function saveAnns(list){DB.LS.set('femos_announcements',list);}

const AnnPage = (() => {
  let _filter = 'all';

  function filter(type, btn) {
    _filter = type;
    document.querySelectorAll('.filter-chip').forEach(el => {
      el.classList.toggle('active', el === btn);
    });
    render();
  }

  function render() {
    const user = Auth.Session.load(); if (!user) return;
    const uid  = user.id || 'demo_student';
    let list   = getAnns();
    if (_filter !== 'all') list = list.filter(a => a.type === _filter);

    const pending = list.filter(a => a.requiresAck && !a.ackedBy.includes(uid));
    const banner  = document.getElementById('pend-banner');
    if (banner) {
      banner.classList.toggle('hidden', !pending.length);
      Utils.DOM.setText('pend-cnt', pending.length);
    }
    Utils.DOM.setText('st-unread', pending.length);

    const el = document.getElementById('ann-list'); if (!el) return;
    if (!list.length) {
      el.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-tertiary)"><div style="font-size:40px;margin-bottom:8px">📭</div><div style="font-size:15px;font-weight:600;color:var(--text-secondary)">Hakuna matangazo</div></div>';
      return;
    }
    el.innerHTML = list.map(a => {
      const cfg    = ANN_CFG[a.type] || ANN_CFG.info;
      const isAck  = a.ackedBy.includes(uid);
      const isRead = a.readBy.includes(uid);
      const unread = !isRead && !isAck;
      return `<div class="card" style="padding:14px 16px;cursor:pointer;position:relative;overflow:hidden;transition:background var(--dur-sm);${unread?'border-color:var(--border-mid)':''}" onclick="AnnPage.openDetail('${a.id}')" role="button" tabindex="0">
        ${unread?'<div style="position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--clr-danger)"></div>':''}
        <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:8px">
          <div style="width:36px;height:36px;border-radius:var(--r-sm);background:${cfg.color}22;border:1px solid ${cfg.color}44;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">${cfg.emoji}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:${cfg.color};margin-bottom:2px">${cfg.label}</div>
            <div style="font-size:11px;color:var(--text-tertiary)">${a.sender.emoji} ${a.sender.name}</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
            ${unread?'<div style="width:8px;height:8px;border-radius:50%;background:var(--clr-danger)"></div>':''}
            <div style="font-size:10px;color:var(--text-tertiary)">${Utils.DateTime.timeAgo(a.sentAt)}</div>
          </div>
        </div>
        <div style="font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:4px;letter-spacing:-.01em">${Utils.Str.escape(a.title)}</div>
        <div style="font-size:12px;color:var(--text-tertiary);line-height:1.5;margin-bottom:10px">${Utils.Str.truncate(a.body,100)}</div>
        <div style="display:flex;align-items:center;justify-content:space-between">
          ${a.requiresAck ? (isAck?'<span class="tag tag-green">✅ Umethibitisha</span>':'<span class="tag tag-red">⚠️ Inahitaji uthibitisho</span>') : '<span class="tag tag-neutral">📰 Habari</span>'}
          <span style="font-size:10px;color:var(--text-tertiary)">${a.readBy.length} wamesoma</span>
        </div>
      </div>`;
    }).join('');
  }

  function openDetail(id) {
    const list = getAnns();
    const a    = list.find(x => x.id === id); if (!a) return;
    const user = Auth.Session.load();
    const uid  = user?.id || 'demo_student';
    const cfg  = ANN_CFG[a.type] || ANN_CFG.info;
    const isAck = a.ackedBy.includes(uid);
    const isOwner = ['lecturer','uni-admin','super-admin','vc','hod'].includes(user?.role);

    // Mark read
    if (!a.readBy.includes(uid)) {
      a.readBy.push(uid);
      saveAnns(list);
    }

    Utils.DOM.setHTML('m-type',   `<span style="color:${cfg.color}">${cfg.emoji} ${cfg.label}</span>`);
    Utils.DOM.setText('m-title',  a.title);
    Utils.DOM.setText('m-sender', a.sender.emoji + ' ' + a.sender.name);
    Utils.DOM.setText('m-time',   Utils.DateTime.timeAgo(a.sentAt));
    Utils.DOM.setText('m-body',   a.body);

    // Stats
    const statsEl = document.getElementById('m-stats');
    if (statsEl) {
      statsEl.classList.toggle('hidden', !isOwner);
      if (isOwner) {
        Utils.DOM.setText('ms-read',    a.readBy.length);
        Utils.DOM.setText('ms-acked',   a.ackedBy.length);
        Utils.DOM.setText('ms-pending', Math.max(0, (a.enrolled||82) - a.ackedBy.length));
      }
    }

    // Ack button
    const ackBtn = document.getElementById('m-ack-btn');
    const ackBadge = document.getElementById('m-acked-badge');
    if (ackBtn)   ackBtn.classList.toggle('hidden', !a.requiresAck || isAck);
    if (ackBadge) ackBadge.classList.toggle('hidden', !isAck);
    if (ackBtn && !isAck) {
      ackBtn.onclick = () => ack(id);
    }

    App.Modal.open('ann-modal');
  }

  function ack(id) {
    const list = getAnns();
    const a    = list.find(x => x.id === id); if (!a) return;
    const user = Auth.Session.load();
    const uid  = user?.id || 'demo_student';
    if (!a.ackedBy.includes(uid)) a.ackedBy.push(uid);
    saveAnns(list);
    document.getElementById('m-ack-btn')?.classList.add('hidden');
    document.getElementById('m-acked-badge')?.classList.remove('hidden');
    App.Toast.success('Umekubali tangazo hili');
    if (navigator.vibrate) navigator.vibrate([10, 30, 10]);
    App.Modal.close('ann-modal');
    render();
  }

  return { filter, render, openDetail };
})();

document.addEventListener('DOMContentLoaded', () => {
  if (!Router.requireAuth()) return;
  AnnPage.render();
});
</script>
</body>
</html>
