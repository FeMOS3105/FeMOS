  <!-- Login card -->
  <div class="card auth-card fade-in anim-3">
    <h1 class="auth-card-title">Karibu tena 👋</h1>
    <p class="auth-card-sub">Ingia kwenye akaunti yako ya FeMOS</p>

    <!-- Identifier -->
    <div class="form-group">
      <label class="form-label" for="login-id">Barua pepe / Reg No / Unique ID</label>
      <div class="form-field">
        <span class="field-icon-left" aria-hidden="true">📧</span>
        <input
          class="form-input"
          id="login-id"
          type="text"
          inputmode="email"
          autocomplete="username"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
          placeholder="jina@must.ac.tz au MUST/Reg_No"
          aria-label="Barua pepe, Reg No, au Unique ID"
          required
        >
      </div>
      <div class="form-message hidden" id="id-error" role="alert"></div>
    </div>

    <!-- Password -->
    <div class="form-group">
      <label class="form-label" for="login-pw">Nywila</label>
      <div class="form-field">
        <span class="field-icon-left" aria-hidden="true">🔐</span>
        <input
          class="form-input"
          id="login-pw"
          type="password"
          autocomplete="current-password"
          placeholder="Nywila yako"
          aria-label="Nywila"
          required
        >
        <button
          class="field-icon-right"
          id="pw-toggle"
          type="button"
          aria-label="Onyesha/Ficha nywila"
          onclick="LoginPage.togglePw()"
        >👁️</button>
      </div>
      <div class="form-message hidden" id="pw-error" role="alert"></div>
    </div>

    <!-- Submit error -->
    <div class="form-message error hidden" id="login-error" role="alert"></div>

    <!-- Submit -->
    <button
      class="btn btn-primary btn-full"
      id="login-btn"
      type="button"
      onclick="LoginPage.submit()"
    >
      <span class="btn-text">🔐 Ingia</span>
    </button>

    <!-- Divider -->
    <div class="auth-divider"><span>au jaribu akaunti ya demo</span></div>

    <!-- Demo buttons -->
    <div class="auth-demo-row">
      <button class="btn btn-secondary" onclick="LoginPage.fillDemo('student')"  type="button">🧑‍💻 Mwanafunzi</button>
      <button class="btn btn-secondary" onclick="LoginPage.fillDemo('lecturer')" type="button">👨‍🏫 Mwalimu</button>
      <button class="btn btn-secondary" onclick="LoginPage.fillDemo('admin')"    type="button">🧑‍💼 Admin</button>
    </div>

    <!-- Switch to register -->
    <div class="auth-switch">
      Huna akaunti?
      <a href="register.html">Jisajili hapa →</a>
    </div>
  </div>

  <!-- University strip -->
  <div class="auth-uni-strip fade-in anim-5">
    🏛️ MUST · UDSM · UDOM · na vyuo 22+ Tanzania
  </div>

</main>
</div>

<script src="../js/db.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/router.js"></script>
<script src="../js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Redirect if already logged in
    if (Auth.Session.isValid()) {
      window.location.replace('home.html');
      return;
    }
  });

  const LoginPage = {
    _loading: false,

    togglePw() {
      const inp  = document.getElementById('login-pw');
      const btn  = document.getElementById('pw-toggle');
      const show = inp.type === 'password';
      inp.type   = show ? 'text' : 'password';
      btn.textContent = show ? '🙈' : '👁️';
      btn.setAttribute('aria-label', show ? 'Ficha nywila' : 'Onyesha nywila');
    },

    fillDemo(role) {
      const creds = {
        student:  { id: 'amina.hassan@must.ac.tz',  pw: 'demo123'  },
        lecturer: { id: 'd.mkwasa@must.ac.tz',      pw: 'demo123'  },
        admin:    { id: 'admin@must.ac.tz',          pw: 'admin123' },
      };
      const c = creds[role]; if (!c) return;
      document.getElementById('login-id').value = c.id;
      document.getElementById('login-pw').value = c.pw;
      this._clearErrors();
      App.Toast.info(`Demo: ${role} account imewekwa`);
    },

    _clearErrors() {
      ['id-error','pw-error','login-error'].forEach(id => {
        const el = document.getElementById(id);
        if (el) { el.textContent = ''; el.classList.add('hidden'); }
      });
      ['login-id','login-pw'].forEach(id => {
        const el = document.getElementById(id);
        if (el) { el.classList.remove('error'); }
      });
    },

    _showError(fieldId, msgId, msg) {
      const field = document.getElementById(fieldId);
      const msgEl = document.getElementById(msgId);
      if (field) field.classList.add('error');
      if (msgEl) { msgEl.textContent = '⚠️ ' + msg; msgEl.classList.remove('hidden'); }
    },

    async submit() {
      if (this._loading) return;
      this._clearErrors();

      const id  = document.getElementById('login-id')?.value.trim();
      const pw  = document.getElementById('login-pw')?.value;
      const btn = document.getElementById('login-btn');

      // Validate
      if (!id) { this._showError('login-id', 'id-error', 'Weka barua pepe au Reg No yako'); return; }
      if (!pw) { this._showError('login-pw', 'pw-error', 'Weka nywila yako'); return; }

      // Loading state
      this._loading = true;
      btn.classList.add('btn-loading');
      btn.disabled = true;

      // Simulate network delay
      await new Promise(r => setTimeout(r, 700));

      const result = await Auth.login(id, pw);
      this._loading = false;
      btn.classList.remove('btn-loading');
      btn.disabled = false;

      if (result.ok) {
        btn.querySelector('.btn-text').textContent = '✅ Umeingia!';
        btn.style.background = 'linear-gradient(135deg,#00E5A0,#00B4D8)';
        App.Toast.success(`Karibu, ${result.user.firstName}!`, 'Umeingia kwenye FeMOS');
        if (navigator.vibrate) navigator.vibrate([15, 50, 15]);
        setTimeout(() => window.location.replace('home.html'), 800);
      } else if (result.pending) {
        App.Toast.warning('Akaunti inasubiri idhini', result.error);
        setTimeout(() => window.location.replace('pending.html'), 1200);
      } else {
        const errEl = document.getElementById('login-error');
        if (errEl) { errEl.textContent = '❌ ' + result.error; errEl.classList.remove('hidden'); }
        if (navigator.vibrate) navigator.vibrate([80, 30, 80]);
        btn.querySelector('.btn-text').textContent = '🔐 Ingia';
      }
    },
  };

  // Allow Enter key to submit
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') LoginPage.submit();
  });
</script>
</body>
</html>
