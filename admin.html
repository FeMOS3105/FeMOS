<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FeMOS — Admin</title>
    <style>
      :root {
        --water-light: #5fd4f0; --water-mid: #2ea8ee; --water-deep: #155fd1;
        --ink: #0d1b4b; --muted: #5c6b9a; --line: #dbe6fb; --danger: #e14b4b; --success: #1fae6e; --warn: #e0a020;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "Segoe UI", system-ui, sans-serif; background: linear-gradient(180deg, #eef5ff 0%, #f7fbff 100%);
        color: var(--ink); min-height: 100vh; padding: 20px 16px 60px;
      }
      .shell { max-width: 880px; margin: 0 auto; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
      .brand { display: flex; align-items: center; gap: 10px; }
      .brand img { width: 42px; height: 42px; border-radius: 50%; box-shadow: 0 6px 16px rgba(21,95,209,0.25); }
      .brand h1 { font-size: 1.2rem; background: linear-gradient(90deg, var(--water-mid), var(--water-deep)); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .userchip { display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 999px; padding: 6px 14px 6px 6px; box-shadow: 0 6px 16px rgba(13,27,75,0.08); font-size: 0.82rem; }
      .userchip .av { width: 26px; height: 26px; border-radius: 50%; background: var(--water-mid); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700; overflow: hidden; }
      .userchip .av img { width: 100%; height: 100%; object-fit: cover; }
      .userchip button { background: none; border: none; color: var(--danger); font-weight: 600; cursor: pointer; font-size: 0.78rem; margin-left: 6px; }

      .tabbar { display: flex; gap: 4px; background: #fff; padding: 4px; border-radius: 12px; box-shadow: 0 6px 16px rgba(13,27,75,0.06); margin-bottom: 20px; width: fit-content; }
      .tabbtn { padding: 9px 18px; border: none; background: transparent; border-radius: 9px; font-weight: 600; font-size: 0.86rem; color: var(--muted); cursor: pointer; }
      .tabbtn.active { background: linear-gradient(90deg, var(--water-mid), var(--water-deep)); color: #fff; }

      .panel { display: none; }
      .panel.active { display: block; }

      .card { background: #fff; border-radius: 18px; box-shadow: 0 14px 40px rgba(13,27,75,0.08); padding: 22px; margin-bottom: 16px; }
      .card h2 { font-size: 1rem; margin-bottom: 4px; }
      .card .hint { font-size: 0.8rem; color: var(--muted); margin-bottom: 16px; }

      .empty { text-align: center; padding: 26px; color: var(--muted); font-size: 0.88rem; border: 1.5px dashed var(--line); border-radius: 12px; }

      .prow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px; border: 1.5px solid var(--line); border-radius: 12px; margin-bottom: 10px; flex-wrap: wrap; }
      .prow .info b { display: block; font-size: 0.92rem; }
      .prow .info span { font-size: 0.78rem; color: var(--muted); display: block; margin-top: 2px; }
      .prow .actions { display: flex; gap: 8px; }
      .btn-sm { padding: 8px 14px; border-radius: 8px; border: none; font-weight: 600; font-size: 0.8rem; cursor: pointer; }
      .btn-approve { background: var(--success); color: #fff; }
      .btn-reject { background: transparent; border: 1.5px solid var(--danger); color: var(--danger); }

      .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .field { margin-bottom: 12px; }
      .field label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
      .field input, .field select { width: 100%; padding: 10px 12px; border-radius: 9px; border: 1.5px solid var(--line); font-size: 0.9rem; background: #fbfdff; }
      .btn { padding: 11px 18px; border: none; border-radius: 10px; font-weight: 700; font-size: 0.86rem; cursor: pointer; background: linear-gradient(90deg, var(--water-mid), var(--water-deep)); color: #fff; }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }

      .tree-inst { border: 1.5px solid var(--line); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
      .tree-inst-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: #f5f9ff; font-weight: 700; font-size: 0.92rem; }
      .tree-campus { padding: 10px 14px 10px 26px; border-top: 1px solid var(--line); }
      .tree-campus-head { display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 0.85rem; color: var(--water-deep); margin-bottom: 6px; }
      .tree-course-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0 6px 14px; font-size: 0.82rem; color: var(--ink); }
      .del-x { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 0.78rem; font-weight: 700; }

      .msg { margin-top: 12px; padding: 10px 13px; border-radius: 9px; font-size: 0.82rem; display: none; }
      .msg.show { display: block; }
      .msg.err { background: #fdecec; color: var(--danger); }
      .msg.ok { background: #e9f9f1; color: var(--success); }

      .gate-card { max-width: 460px; margin: 60px auto; text-align: center; background: #fff; border-radius: 18px; padding: 34px 26px; box-shadow: 0 14px 40px rgba(13,27,75,0.1); }
      .gate-card code { display: block; background: #f5f9ff; padding: 10px; border-radius: 8px; font-size: 0.8rem; margin: 12px 0; word-break: break-all; }
    </style>
  </head>
  <body>
    <div class="shell">
      <div id="gate" class="gate-card">Checking admin access...</div>

      <div id="app" style="display:none;">
        <div class="topbar">
          <div class="brand">
            <img src="https://res.cloudinary.com/j8zmetxr/image/upload/v1784632765/FeOS_hwl9eh.png" alt="FeMOS"/>
            <h1>FeMOS Admin</h1>
          </div>
          <div class="userchip">
            <div class="av" id="adminAv">?</div>
            <span id="adminName">...</span>
            <button id="btnLogout">Log Out</button>
          </div>
        </div>

        <div class="tabbar">
          <button class="tabbtn active" data-tab="pending">Pending Registrations</button>
          <button class="tabbtn" data-tab="catalog">Catalog Management</button>
        </div>

        <!-- ============ PENDING REGISTRATIONS ============ -->
        <div class="panel active" id="panel-pending">
          <div class="card">
            <h2>Pending Registrations</h2>
            <div class="hint" id="pendingCount">Loading...</div>
            <div id="pendingList"></div>
          </div>
        </div>

        <!-- ============ CATALOG MANAGEMENT ============ -->
        <div class="panel" id="panel-catalog">
          <div class="card">
            <h2>Add Institution</h2>
            <div class="hint">Short code becomes its ID (e.g. MUST, UDSM) — keep it unique.</div>
            <div class="row2">
              <div class="field"><label>Code</label><input id="newInstCode" placeholder="e.g. MUST"/></div>
              <div class="field"><label>Full Name</label><input id="newInstName" placeholder="e.g. Mbeya University of Science and Technology"/></div>
            </div>
            <button class="btn" id="btnAddInstitution">Add Institution</button>
            <div class="msg" id="msgInst"></div>
          </div>

          <div class="card">
            <h2>Add Campus</h2>
            <div class="row2">
              <div class="field"><label>Institution</label><select id="campusInstSelect"></select></div>
              <div class="field"><label>Campus Name</label><input id="newCampusName" placeholder="e.g. Iyunga Campus"/></div>
            </div>
            <button class="btn" id="btnAddCampus">Add Campus</button>
            <div class="msg" id="msgCampus"></div>
          </div>

          <div class="card">
            <h2>Add Course</h2>
            <div class="row2">
              <div class="field"><label>Institution</label><select id="courseInstSelect"></select></div>
              <div class="field"><label>Campus</label><select id="courseCampusSelect"><option value="">-- pick institution first --</option></select></div>
            </div>
            <div class="field"><label>Course Name</label><input id="newCourseName" placeholder="e.g. BSc. Software Engineering"/></div>
            <button class="btn" id="btnAddCourse">Add Course</button>
            <div class="msg" id="msgCourse"></div>
          </div>

          <div class="card">
            <h2>Current Catalog</h2>
            <div class="hint">Deleting an institution or campus is only allowed once it has no courses/campuses left inside it.</div>
            <div id="catalogTree"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyCb-Y69glDSkNDwgzoCXyUVAz6D86Ccdfo",
        authDomain: "femos-fe742.firebaseapp.com",
        projectId: "femos-fe742",
        storageBucket: "femos-fe742.firebasestorage.app",
        messagingSenderId: "1022203442714",
        appId: "1:1022203442714:web:4fa06d28d788c024bf83a3",
        measurementId: "G-M4DEBFVJCV",
      };
      const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth(app);
      const db = firebase.firestore(app);

      function showMsg(id, text, type) {
        const el = document.getElementById(id);
        el.textContent = text; el.className = "msg show " + type;
        setTimeout(function () { el.classList.remove("show"); }, 4000);
      }

      // ---------- Access gate ----------
      auth.onAuthStateChanged(async function (user) {
        const gate = document.getElementById("gate");
        if (!user) {
          gate.innerHTML = 'You must be signed in. <a href="login.html">Go to login</a>.';
          return;
        }
        try {
          const adminDoc = await db.collection("admins").doc(user.uid).get();
          if (!adminDoc.exists) {
            gate.innerHTML =
              "<h2>Access Denied</h2>" +
              "<p style='color:var(--muted);font-size:0.85rem;margin-top:8px;'>Your account (" + user.email + ") is not an admin yet. " +
              "To grant access, add a document in Firestore: collection <b>admins</b>, document ID:</p>" +
              "<code>" + user.uid + "</code>" +
              "<p style='color:var(--muted);font-size:0.8rem;'>Then reload this page.</p>" +
              '<button class="btn" style="margin-top:14px;" onclick="location.reload()">Reload</button>';
            return;
          }
          gate.style.display = "none";
          document.getElementById("app").style.display = "block";
          document.getElementById("adminName").textContent = user.displayName || user.email;
          if (user.photoURL) {
            document.getElementById("adminAv").innerHTML = '<img src="' + user.photoURL + '" alt=""/>';
          } else {
            document.getElementById("adminAv").textContent = (user.email || "?")[0].toUpperCase();
          }
          initAdminApp();
        } catch (err) {
          gate.innerHTML = "Error checking admin access: " + (err.message || "");
        }
      });

      document.getElementById("btnLogout").addEventListener("click", async function () {
        await auth.signOut();
        window.location.href = "login.html";
      });

      // ---------- Tabs ----------
      document.querySelectorAll(".tabbtn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          document.querySelectorAll(".tabbtn").forEach(function (b) { b.classList.remove("active"); });
          document.querySelectorAll(".panel").forEach(function (p) { p.classList.remove("active"); });
          btn.classList.add("active");
          document.getElementById("panel-" + btn.getAttribute("data-tab")).classList.add("active");
        });
      });

      let appInitialized = false;
      function initAdminApp() {
        if (appInitialized) return;
        appInitialized = true;
        loadPending();
        loadInstitutionSelects();
        loadCatalogTree();
      }

      // ================= PENDING REGISTRATIONS =================
      async function loadPending() {
        const listEl = document.getElementById("pendingList");
        const countEl = document.getElementById("pendingCount");
        listEl.innerHTML = "";
        countEl.textContent = "Loading...";
        try {
          const snap = await db.collectionGroup("pendingStudents").get();
          if (snap.empty) {
            countEl.textContent = "No pending registrations.";
            listEl.innerHTML = '<div class="empty">All caught up — nothing waiting for confirmation.</div>';
            return;
          }
          countEl.textContent = snap.size + " student(s) awaiting confirmation";
          snap.forEach(function (doc) {
            const d = doc.data();
            const rosterRef = doc.ref.parent.parent; // courseRosters/{rosterId}
            const row = document.createElement("div");
            row.className = "prow";
            row.innerHTML =
              '<div class="info"><b>' + escapeHtml(d.fullName || "(no name)") + "</b>" +
              "<span>" + escapeHtml(d.email || "") + "</span>" +
              "<span>" + escapeHtml(d.courseName || "") + " — " + escapeHtml(d.campusName || "") + ", " + escapeHtml(d.institutionName || "") + "</span></div>" +
              '<div class="actions">' +
              '<button class="btn-sm btn-approve">Approve</button>' +
              '<button class="btn-sm btn-reject">Reject</button>' +
              "</div>";
            row.querySelector(".btn-approve").addEventListener("click", async function () {
              await approveStudent(doc.ref, rosterRef.id, doc.id);
            });
            row.querySelector(".btn-reject").addEventListener("click", async function () {
              await rejectStudent(doc.ref, doc.id);
            });
            listEl.appendChild(row);
          });
        } catch (err) {
          countEl.textContent = "";
          listEl.innerHTML = '<div class="empty">Could not load pending list: ' + escapeHtml(err.message || "") + "</div>";
        }
      }

      async function approveStudent(pendingDocRef, rosterId, studentUid) {
        try {
          await db.collection("users").doc(studentUid).set(
            { registrationStatus: "confirmed", confirmedByCR: true },
            { merge: true }
          );
          await pendingDocRef.delete();
          loadPending();
        } catch (err) {
          alert("Could not approve: " + (err.message || ""));
        }
      }
      async function rejectStudent(pendingDocRef, studentUid) {
        if (!confirm("Reject this registration? The student will need to register again.")) return;
        try {
          await pendingDocRef.delete();
          await db.collection("users").doc(studentUid).set(
            { institutionId: null, institutionName: null, campusId: null, campusName: null, courseId: null, courseName: null, registrationStatus: null },
            { merge: true }
          );
          loadPending();
        } catch (err) {
          alert("Could not reject: " + (err.message || ""));
        }
      }

      // ================= CATALOG MANAGEMENT =================
      function slugify(text) {
        return text.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
      }
      function escapeHtml(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; });
      }

      async function loadInstitutionSelects() {
        const snap = await db.collection("institutions").orderBy("name").get();
        const opts = snap.docs.map(function (d) { return '<option value="' + d.id + '">' + escapeHtml(d.data().name) + "</option>"; }).join("");
        document.getElementById("campusInstSelect").innerHTML = opts || '<option value="">-- none yet --</option>';
        document.getElementById("courseInstSelect").innerHTML = opts || '<option value="">-- none yet --</option>';
        if (snap.size) loadCourseCampusOptions(document.getElementById("courseInstSelect").value);
      }

      async function loadCourseCampusOptions(institutionId) {
        const sel = document.getElementById("courseCampusSelect");
        if (!institutionId) { sel.innerHTML = '<option value="">-- pick institution first --</option>'; return; }
        const snap = await db.collection("institutions").doc(institutionId).collection("campuses").orderBy("name").get();
        sel.innerHTML = snap.docs.map(function (d) { return '<option value="' + d.id + '">' + escapeHtml(d.data().name) + "</option>"; }).join("") || '<option value="">-- no campuses yet --</option>';
      }
      document.getElementById("courseInstSelect").addEventListener("change", function () { loadCourseCampusOptions(this.value); });

      document.getElementById("btnAddInstitution").addEventListener("click", async function () {
        const code = document.getElementById("newInstCode").value.trim().toUpperCase();
        const name = document.getElementById("newInstName").value.trim();
        if (!code || !name) { showMsg("msgInst", "Fill in both code and name.", "err"); return; }
        try {
          await db.collection("institutions").doc(code).set({ name: name, code: code });
          document.getElementById("newInstCode").value = "";
          document.getElementById("newInstName").value = "";
          showMsg("msgInst", "Institution added.", "ok");
          loadInstitutionSelects();
          loadCatalogTree();
        } catch (err) { showMsg("msgInst", "Error: " + (err.message || ""), "err"); }
      });

      document.getElementById("btnAddCampus").addEventListener("click", async function () {
        const instId = document.getElementById("campusInstSelect").value;
        const name = document.getElementById("newCampusName").value.trim();
        if (!instId || !name) { showMsg("msgCampus", "Pick an institution and enter a campus name.", "err"); return; }
        try {
          const campusId = slugify(name);
          await db.collection("institutions").doc(instId).collection("campuses").doc(campusId).set({ name: name });
          document.getElementById("newCampusName").value = "";
          showMsg("msgCampus", "Campus added.", "ok");
          loadCatalogTree();
          if (document.getElementById("courseInstSelect").value === instId) loadCourseCampusOptions(instId);
        } catch (err) { showMsg("msgCampus", "Error: " + (err.message || ""), "err"); }
      });

      document.getElementById("btnAddCourse").addEventListener("click", async function () {
        const instId = document.getElementById("courseInstSelect").value;
        const campusId = document.getElementById("courseCampusSelect").value;
        const name = document.getElementById("newCourseName").value.trim();
        if (!instId || !campusId || !name) { showMsg("msgCourse", "Pick institution, campus, and enter a course name.", "err"); return; }
        try {
          const courseId = slugify(name);
          await db.collection("institutions").doc(instId).collection("campuses").doc(campusId).collection("courses").doc(courseId).set({ name: name });
          document.getElementById("newCourseName").value = "";
          showMsg("msgCourse", "Course added.", "ok");
          loadCatalogTree();
        } catch (err) { showMsg("msgCourse", "Error: " + (err.message || ""), "err"); }
      });

      async function loadCatalogTree() {
        const treeEl = document.getElementById("catalogTree");
        treeEl.innerHTML = "Loading...";
        const instSnap = await db.collection("institutions").orderBy("name").get();
        if (instSnap.empty) { treeEl.innerHTML = '<div class="empty">No institutions yet. Add one above.</div>'; return; }

        let html = "";
        for (const instDoc of instSnap.docs) {
          const inst = instDoc.data();
          html += '<div class="tree-inst"><div class="tree-inst-head"><span>' + escapeHtml(inst.name) + " (" + instDoc.id + ')</span>' +
                  '<button class="del-x" data-del-inst="' + instDoc.id + '">Delete</button></div>';
          const campSnap = await db.collection("institutions").doc(instDoc.id).collection("campuses").orderBy("name").get();
          if (campSnap.empty) { html += '<div class="tree-campus"><span style="color:var(--muted);font-size:0.8rem;">No campuses yet.</span></div>'; }
          for (const campDoc of campSnap.docs) {
            const camp = campDoc.data();
            html += '<div class="tree-campus"><div class="tree-campus-head"><span>' + escapeHtml(camp.name) + '</span>' +
                    '<button class="del-x" data-del-campus="' + instDoc.id + "|" + campDoc.id + '">Delete</button></div>';
            const courseSnap = await db.collection("institutions").doc(instDoc.id).collection("campuses").doc(campDoc.id).collection("courses").orderBy("name").get();
            if (courseSnap.empty) { html += '<div style="color:var(--muted);font-size:0.78rem;padding-left:14px;">No courses yet.</div>'; }
            courseSnap.forEach(function (courseDoc) {
              html += '<div class="tree-course-row"><span>' + escapeHtml(courseDoc.data().name) + '</span>' +
                      '<button class="del-x" data-del-course="' + instDoc.id + "|" + campDoc.id + "|" + courseDoc.id + '">Remove</button></div>';
            });
            html += "</div>";
          }
          html += "</div>";
        }
        treeEl.innerHTML = html;

        treeEl.querySelectorAll("[data-del-course]").forEach(function (btn) {
          btn.addEventListener("click", async function () {
            const parts = btn.getAttribute("data-del-course").split("|");
            if (!confirm("Remove this course?")) return;
            await db.collection("institutions").doc(parts[0]).collection("campuses").doc(parts[1]).collection("courses").doc(parts[2]).delete();
            loadCatalogTree();
          });
        });
        treeEl.querySelectorAll("[data-del-campus]").forEach(function (btn) {
          btn.addEventListener("click", async function () {
            const parts = btn.getAttribute("data-del-campus").split("|");
            const courses = await db.collection("institutions").doc(parts[0]).collection("campuses").doc(parts[1]).collection("courses").limit(1).get();
            if (!courses.empty) { alert("This campus still has courses inside it. Remove those first."); return; }
            if (!confirm("Delete this campus?")) return;
            await db.collection("institutions").doc(parts[0]).collection("campuses").doc(parts[1]).delete();
            loadCatalogTree();
          });
        });
        treeEl.querySelectorAll("[data-del-inst]").forEach(function (btn) {
          btn.addEventListener("click", async function () {
            const instId = btn.getAttribute("data-del-inst");
            const campuses = await db.collection("institutions").doc(instId).collection("campuses").limit(1).get();
            if (!campuses.empty) { alert("This institution still has campuses inside it. Remove those first."); return; }
            if (!confirm("Delete this institution?")) return;
            await db.collection("institutions").doc(instId).delete();
            loadCatalogTree();
            loadInstitutionSelects();
          });
        });
      }
    </script>
  </body>
</html>
