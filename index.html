<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    const status = document.getElementById('splash-status');

    const steps = [
      { text: 'Checking account…',   delay: 600  },
      { text: 'Starting system…',        delay: 1200 },
      { text: 'Welcome to FeMOS!',       delay: 1900 },
    ];

    for (const step of steps) {
      await new Promise(r => setTimeout(r, step.delay - (steps.indexOf(step) > 0 ? steps[steps.indexOf(step)-1].delay : 0)));
      if (status) status.textContent = step.text;
    }

    await new Promise(r => setTimeout(r, 300));

    // Routing decision
    if (Auth.Session.isValid()) {
      window.location.replace('pages/home.html');
    } else if (Auth.Pending.load()) {
      window.location.replace('pages/pending.html');
    } else {
      window.location.replace('pages/login.html');
    }
  });
</script>
