<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FeMOS — Loading...</title>
<style>
  :root{
    --water-light:#5fd4f0;
    --water-mid:#2ea8ee;
    --water-deep:#155fd1;
    --water-abyss:#0b2f9e;
    --ink:#0d1b4b;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#ffffff;
    font-family:'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
  }

  #splash{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    background:#ffffff;
    overflow:hidden;
  }

  /* ---------- Ambient glow behind logo ---------- */
  #glow{
    position:absolute;
    top:50%;
    left:50%;
    width:60vmin;
    height:60vmin;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(95,212,240,0.35) 0%, rgba(95,212,240,0) 70%);
    border-radius:50%;
    animation:pulseGlow 2.6s ease-in-out infinite;
    z-index:1;
  }

  @keyframes pulseGlow{
    0%,100%{opacity:.55; transform:translate(-50%,-50%) scale(0.92);}
    50%{opacity:1; transform:translate(-50%,-50%) scale(1.08);}
  }

  /* ---------- Logo stack ---------- */
  #logo-wrap{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:38vmin;
    height:38vmin;
    max-width:280px;
    max-height:280px;
    z-index:5;
    filter:drop-shadow(0 10px 30px rgba(21,95,209,0.35));
    animation:floatLogo 3.4s ease-in-out infinite;
  }

  @keyframes floatLogo{
    0%,100%{ transform:translate(-50%,-50%) translateY(0); }
    50%{ transform:translate(-50%,-50%) translateY(-1.2vmin); }
  }

  #logo-white,#logo-color{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
  }

  #logo-white{
    filter:brightness(0) invert(1) drop-shadow(0 0 10px rgba(255,255,255,0.9));
    opacity:0.97;
  }

  #logo-color{
    clip-path: inset(0 0 0 0);
    -webkit-clip-path: inset(0 0 0 0);
    will-change: clip-path;
  }

  /* ---------- Sparkle accent (echoes the logo's star) ---------- */
  .sparkle{
    position:absolute;
    width:14px;
    height:14px;
    background:#5fd4f0;
    clip-path:polygon(50% 0%, 63% 37%, 100% 50%, 63% 63%, 50% 100%, 37% 63%, 0% 50%, 37% 37%);
    z-index:6;
    opacity:0;
    animation:sparklePop 2.8s ease-in-out infinite;
  }
  .sparkle.s1{ top:22%; left:60%; animation-delay:0.2s; }
  .sparkle.s2{ top:68%; left:26%; width:9px; height:9px; animation-delay:1s; }
  .sparkle.s3{ top:30%; left:24%; width:7px; height:7px; animation-delay:1.8s; }

  @keyframes sparklePop{
    0%,100%{opacity:0; transform:scale(0.3) rotate(0deg);}
    50%{opacity:1; transform:scale(1) rotate(90deg);}
  }

  /* ---------- Water container ---------- */
  #water-container{
    position:absolute;
    left:0;
    bottom:0;
    width:100%;
    height:0%;
    z-index:3;
    pointer-events:none;
  }

  #water-body{
    position:absolute;
    inset:0;
    top:14px;
    background:linear-gradient(180deg,
      var(--water-light) 0%,
      var(--water-mid) 38%,
      var(--water-deep) 72%,
      var(--water-abyss) 100%);
  }

  .wave-layer{
    position:absolute;
    top:-1px;
    left:0;
    width:200%;
    height:36px;
    background-repeat:repeat-x;
    background-size:50% 100%;
  }

  #wave1{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 40' preserveAspectRatio='none'><path d='M0 20 Q 50 0 100 20 T 200 20 T 300 20 T 400 20 V40 H0 Z' fill='white' fill-opacity='0.85'/></svg>");
    animation: waveShift 3.2s linear infinite;
    opacity:0.9;
  }
  #wave2{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 40' preserveAspectRatio='none'><path d='M0 22 Q 60 4 120 22 T 240 22 T 360 22 T 480 22 V40 H0 Z' fill='%235fd4f0' fill-opacity='0.9'/></svg>");
    animation: waveShift 4.6s linear infinite reverse;
    top:6px;
    opacity:0.75;
  }

  @keyframes waveShift{
    from{ transform:translateX(0); }
    to{ transform:translateX(-50%); }
  }

  /* subtle sheen crossing the water */
  #sheen{
    position:absolute;
    inset:0;
    background:linear-gradient(120deg, rgba(255,255,255,0) 40%, rgba(255,255,255,0.18) 50%, rgba(255,255,255,0) 60%);
    background-size:250% 250%;
    animation:sheenMove 5s ease-in-out infinite;
    mix-blend-mode:screen;
  }
  @keyframes sheenMove{
    0%{background-position:120% 0%;}
    50%{background-position:-20% 0%;}
    100%{background-position:120% 0%;}
  }

  /* ---------- Brand text ---------- */
  #brand{
    position:absolute;
    top:calc(50% + 20vmin);
    left:50%;
    transform:translate(-50%,0);
    z-index:5;
    text-align:center;
    color:#0d1b4b;
    opacity:0;
    animation:fadeInUp 0.9s ease forwards 0.5s;
  }
  #brand h1{
    font-size:clamp(22px,5vw,30px);
    font-weight:700;
    letter-spacing:2px;
    background:linear-gradient(90deg,#2ea8ee,#155fd1);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  #brand p{
    margin-top:6px;
    font-size:13px;
    letter-spacing:3px;
    color:#5c6b9a;
    text-transform:uppercase;
  }

  @keyframes fadeInUp{
    from{opacity:0; transform:translate(-50%,14px);}
    to{opacity:1; transform:translate(-50%,0);}
  }

  /* ---------- Loading dots ---------- */
  #loading-label{
    position:absolute;
    bottom:9%;
    left:50%;
    transform:translate(-50%,0);
    z-index:7;
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    letter-spacing:2px;
    color:#ffffff;
    text-transform:uppercase;
    opacity:0;
    animation:fadeInUp 0.7s ease forwards 0.9s;
    text-shadow:0 1px 4px rgba(0,0,0,0.25);
  }
  #loading-label.on-white{ color:#155fd1; text-shadow:none; }

  .dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:currentColor;
    animation:dotPulse 1.2s ease-in-out infinite;
  }
  .dot:nth-child(2){ animation-delay:0.15s; }
  .dot:nth-child(3){ animation-delay:0.3s; }
  @keyframes dotPulse{
    0%,80%,100%{opacity:0.25; transform:scale(0.8);}
    40%{opacity:1; transform:scale(1.15);}
  }

  /* ---------- Error fallback ---------- */
  #error-box{
    position:fixed;
    inset:0;
    z-index:50;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:14px;
    background:linear-gradient(180deg,#0b2f9e,#155fd1);
    color:#fff;
    text-align:center;
    padding:32px;
    animation:fadeInSimple 0.5s ease forwards;
  }
  @keyframes fadeInSimple{ from{opacity:0;} to{opacity:1;} }

  #error-box svg{ width:56px; height:56px; opacity:0.9; }
  #error-box h2{ font-size:20px; letter-spacing:0.5px; }
  #error-box p{ font-size:14px; color:#cfe4ff; max-width:340px; line-height:1.5; }
  #error-box button{
    margin-top:10px;
    padding:10px 22px;
    border:1px solid rgba(255,255,255,0.6);
    background:rgba(255,255,255,0.08);
    color:#fff;
    border-radius:30px;
    font-size:13px;
    letter-spacing:1px;
    cursor:pointer;
    transition:background 0.2s ease;
  }
  #error-box button:hover{ background:rgba(255,255,255,0.2); }

  /* ---------- Fade-out transition to login ---------- */
  #splash.leaving{
    animation:splashLeave 0.6s ease forwards;
  }
  @keyframes splashLeave{
    to{ opacity:0; transform:scale(1.03); }
  }
</style>
</head>

<div id="error-box">
  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"

  <h2>Can't get login.html page</h2>
  <p>The <strong>login.html</strong> file was not found in this folder. Place login.html in the same directory as splash.html, then try again.</p>
  <button onclick="retryLoad()">Try Again</button>
</div>

<script>
  const waterContainer = document.getElementById('water-container');
  const logoColor      = document.getElementById('logo-color');
  const logoWrap        = document.getElementById('logo-wrap');
  const loadingLabel    = document.getElementById('loading-label');
  const splash          = document.getElementById('splash');
  const errorBox        = document.getElementById('error-box');

  const DURATION = 4200; // duration of the water-fill animation (ms)
  let startTime = null;
  let finished = false;

  function easeInOutCubic(t){
    return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
  }

  function tick(timestamp){
    if(!startTime) startTime = timestamp;
    const elapsed = timestamp - startTime;
    const rawT = Math.min(elapsed / DURATION, 1);
    const t = easeInOutCubic(rawT);

    const waterVh = t * 100; // asilimia ya urefu wa screen inayofunikwa na maji
    waterContainer.style.height = waterVh + 'vh';

    // -- sync logo color with water depth --
    const logoRect = logoWrap.getBoundingClientRect();
    const viewportH = window.innerHeight;
    const waterTopY = viewportH - (viewportH * (waterVh / 100));

    let covered = (logoRect.bottom - waterTopY) / logoRect.height;
    covered = Math.max(0, Math.min(1, covered));
    const clipBottom = (covered * 100).toFixed(2);
    logoColor.style.clipPath = `inset(0 0 ${clipBottom}% 0)`;
    logoColor.style.webkitClipPath = `inset(0 0 ${clipBottom}% 0)`;

    // -- switch "Loading..." label color once water covers the lower part of the screen --
    if (waterVh > 55) {
      loadingLabel.classList.add('on-white');
    } else {
      loadingLabel.classList.remove('on-white');
    }

    if(rawT < 1){
      requestAnimationFrame(tick);
    } else if(!finished){
      finished = true;
      goToLogin();
    }
  }

  requestAnimationFrame(tick);

  function goToLogin(){
    fetch('login.html', { method:'HEAD', cache:'no-store' })
      .then(res => {
        if(res.ok){
          splash.classList.add('leaving');
          setTimeout(() => { window.location.href = 'login.html'; }, 580);
        } else {
          showError();
        }
      })
      .catch(() => { showError(); });
  }

  function showError(){
    errorBox.style.display = 'flex';
  }

  function retryLoad(){
    errorBox.style.display = 'none';
    finished = false;
    startTime = null;
    waterContainer.style.height = '0%';
    logoColor.style.clipPath = 'inset(0 0 0 0)';
    logoColor.style.webkitClipPath = 'inset(0 0 0 0)';
    requestAnimationFrame(tick);
  }
</script>
